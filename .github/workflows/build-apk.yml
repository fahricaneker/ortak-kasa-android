name: Android APK oluştur

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Web uygulamasını doğrula
        run: |
          npm run check
          npm test

      - name: Android projesini güncelle
        run: |
          npm run build
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ortak-Kasa.apk

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Ortak-Kasa-Android
          path: Ortak-Kasa.apk
          if-no-files-found: error
          retention-days: 30
